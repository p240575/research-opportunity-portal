<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>404 – Page Not Found | Research Portal</title>
  <meta name="description" content="The page you requested could not be found on the Research Portal." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg-1: #0a0e1a;
      --accent: #6c63ff;
      --accent-2: #a78bfa;
      --glass: rgba(255,255,255,0.05);
      --glass-border: rgba(255,255,255,0.10);
      --text: #e2e8f0;
      --muted: #94a3b8;
    }
    html, body { height: 100%; font-family: 'Inter', sans-serif; background: var(--bg-1); color: var(--text); overflow: hidden; }
    body::before, body::after { content: ''; position: fixed; border-radius: 50%; filter: blur(120px); opacity: 0.25; pointer-events: none; animation: drift 8s ease-in-out infinite alternate; }
    body::before { width: 520px; height: 520px; background: radial-gradient(circle, #6c63ff, #3b82f6); top: -180px; left: -160px; }
    body::after { width: 420px; height: 420px; background: radial-gradient(circle, #a78bfa, #ec4899); bottom: -150px; right: -140px; animation-delay: -4s; }
    @keyframes drift { from { transform: translate(0,0) scale(1); } to { transform: translate(40px,30px) scale(1.08); } }
    .container { height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 2rem; position: relative; z-index: 1; }
    .glass-card { background: var(--glass); border: 1px solid var(--glass-border); border-radius: 24px; padding: 3.5rem 4rem; backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px); max-width: 520px; width: 100%; box-shadow: 0 8px 40px rgba(0,0,0,0.4); animation: fadeUp 0.6s ease both; }
    @keyframes fadeUp { from { opacity: 0; transform: translateY(28px); } to { opacity: 1; transform: translateY(0); } }
    .error-code { font-size: 7rem; font-weight: 800; line-height: 1; background: linear-gradient(135deg, var(--accent), var(--accent-2)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; letter-spacing: -4px; margin-bottom: 0.5rem; animation: pulse 3s ease-in-out infinite; }
    @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.8; } }
    .divider { width: 60px; height: 3px; background: linear-gradient(90deg, var(--accent), var(--accent-2)); border-radius: 2px; margin: 1.2rem auto; }
    .title { font-size: 1.5rem; font-weight: 700; margin-bottom: 0.75rem; color: #f1f5f9; }
    .subtitle { font-size: 0.95rem; color: var(--muted); line-height: 1.7; margin-bottom: 2.2rem; }
    .btn-group { display: flex; gap: 0.75rem; justify-content: center; flex-wrap: wrap; }
    .btn { display: inline-flex; align-items: center; gap: 0.45rem; padding: 0.7rem 1.6rem; border-radius: 10px; font-size: 0.9rem; font-weight: 600; cursor: pointer; text-decoration: none; transition: all 0.2s ease; border: none; }
    .btn-primary { background: linear-gradient(135deg, var(--accent), var(--accent-2)); color: #fff; box-shadow: 0 4px 20px rgba(108,99,255,0.35); }
    .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 6px 28px rgba(108,99,255,0.55); }
    .btn-secondary { background: var(--glass); color: var(--text); border: 1px solid var(--glass-border); }
    .btn-secondary:hover { background: rgba(255,255,255,0.10); transform: translateY(-2px); }
    .path-label { margin-top: 2rem; font-size: 0.78rem; color: rgba(148,163,184,0.5); font-family: monospace; }
    .path-value { color: rgba(167,139,250,0.7); }
  </style>
</head>
<body>
  <div class="container">
    <div class="glass-card">
      <div class="error-code">404</div>
      <div class="divider"></div>
      <h1 class="title">Page Not Found</h1>
      <p class="subtitle">
        The page you're looking for doesn't exist or may have been moved.<br/>
        Double-check the URL, or navigate back to a valid section.
      </p>
      <div class="btn-group">
        <a href="/" class="btn btn-primary" id="btn-home">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
          Go Home
        </a>
        <button class="btn btn-secondary" id="btn-back" onclick="history.back()">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
          Go Back
        </button>
      </div>
      <p class="path-label">Requested: <span class="path-value" id="requested-path"></span></p>
    </div>
  </div>
  <script>
    document.getElementById('requested-path').textContent = window.location.pathname;
  </script>
</body>
</html>
