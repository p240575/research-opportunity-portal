<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FAST-NUCES | Administrator Sign In</title>
  <meta name="description" content="Secure administrative login for managing university research opportunities.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/style.css">
  <style>
    /* Bulletproof Standalone Styling for Admin Login Page */
    :root {
      --bg-primary: #0a0e17;
      --bg-secondary: #111827;
      --card-bg: rgba(17, 24, 39, 0.88);
      --card-border: rgba(255, 255, 255, 0.12);
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --text-dim: #64748b;
      --accent-primary: #6366f1;
      --accent-primary-hover: #4f46e5;
      --accent-cyan: #06b6d4;
      --accent-emerald: #10b981;
      --accent-rose: #f43f5e;
      --font-sans: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
      --font-mono: 'Space Grotesk', monospace;
      --shadow-lg: 0 16px 40px rgba(0, 0, 0, 0.5);
      --radius-sm: 8px;
      --radius-md: 14px;
      --radius-lg: 20px;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: var(--font-sans);
      background-color: var(--bg-primary);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      position: relative;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
    }

    .ambient-glow {
      position: fixed;
      border-radius: 50%;
      filter: blur(140px);
      pointer-events: none;
      z-index: 0;
      opacity: 0.35;
    }
    .glow-1 {
      width: 500px;
      height: 500px;
      background: radial-gradient(circle, #6366f1 0%, transparent 70%);
      top: -150px;
      right: -100px;
    }
    .glow-2 {
      width: 450px;
      height: 450px;
      background: radial-gradient(circle, #06b6d4 0%, transparent 70%);
      bottom: 50px;
      left: -150px;
    }

    .app-header {
      position: sticky;
      top: 0;
      z-index: 40;
      background: rgba(10, 14, 23, 0.82);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      border-bottom: 1px solid var(--card-border);
    }

    .header-container {
      max-width: 1280px;
      margin: 0 auto;
      padding: 1.1rem 1.5rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1.5rem;
    }

    .brand a {
      display: flex;
      align-items: center;
      gap: 0.9rem;
      text-decoration: none;
    }

    .brand-logo {
      width: 42px;
      height: 42px;
      background: linear-gradient(135deg, #6366f1, #06b6d4);
      border-radius: var(--radius-md);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      box-shadow: 0 0 15px rgba(99, 102, 241, 0.4);
    }

    .university-tag {
      font-size: 0.72rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--accent-cyan);
      display: block;
    }

    .portal-title {
      font-size: 1.25rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      background: linear-gradient(to right, #ffffff, #cbd5e1);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .login-page-container {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 1.5rem;
      position: relative;
      z-index: 10;
    }

    .login-card {
      background: var(--card-bg);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--card-border);
      border-radius: var(--radius-lg);
      max-width: 440px;
      width: 100%;
      padding: 2.5rem 2.25rem;
      box-shadow: var(--shadow-lg), 0 0 45px rgba(99, 102, 241, 0.25);
      position: relative;
      overflow: hidden;
      animation: modalSlideUp 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }

    @keyframes modalSlideUp {
      from { opacity: 0; transform: translateY(20px) scale(0.97); }
      to { opacity: 1; transform: translateY(0); }
    }

    .login-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 4px;
      background: linear-gradient(90deg, #6366f1, #06b6d4, #a855f7);
    }

    .login-header {
      text-align: center;
      margin-bottom: 1.75rem;
    }

    .login-logo {
      width: 58px;
      height: 58px;
      background: linear-gradient(135deg, #6366f1, #06b6d4);
      border-radius: var(--radius-md);
      margin: 0 auto 1.25rem;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      box-shadow: 0 0 25px rgba(99, 102, 241, 0.45);
    }

    .login-title {
      font-size: 1.5rem;
      font-weight: 800;
      letter-spacing: -0.02em;
      margin-bottom: 0.35rem;
      color: #fff;
    }

    .login-subtitle {
      font-size: 0.85rem;
      color: var(--text-muted);
      line-height: 1.45;
    }

    .demo-credentials-box {
      background: rgba(99, 102, 241, 0.08);
      border: 1px dashed rgba(99, 102, 241, 0.3);
      border-radius: var(--radius-md);
      padding: 0.75rem 1rem;
      margin-bottom: 1.5rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.75rem;
      font-size: 0.8rem;
    }

    .demo-cred-info {
      display: flex;
      flex-direction: column;
      gap: 0.15rem;
    }

    .demo-cred-label {
      font-size: 0.7rem;
      text-transform: uppercase;
      font-weight: 700;
      letter-spacing: 0.05em;
      color: #a5b4fc;
    }

    .demo-cred-values {
      color: #e2e8f0;
      font-family: var(--font-mono);
      font-size: 0.8rem;
    }

    .btn-fill-demo {
      background: rgba(99, 102, 241, 0.2);
      border: 1px solid rgba(99, 102, 241, 0.4);
      color: #c7d2fe;
      padding: 0.35rem 0.65rem;
      border-radius: var(--radius-sm);
      font-size: 0.75rem;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.2s ease;
      font-family: inherit;
    }
    .btn-fill-demo:hover {
      background: rgba(99, 102, 241, 0.35);
      color: #fff;
    }

    .form-group {
      margin-bottom: 1.15rem;
    }

    label {
      display: block;
      font-size: 0.82rem;
      font-weight: 600;
      color: #cbd5e1;
      margin-bottom: 0.45rem;
    }
    .required {
      color: var(--accent-rose);
    }

    .input-with-icon-wrapper {
      position: relative;
      display: flex;
      align-items: center;
      width: 100%;
    }

    .input-leading-icon {
      position: absolute;
      left: 0.95rem;
      color: var(--text-dim);
      pointer-events: none;
      display: flex;
      align-items: center;
      z-index: 2;
    }

    .login-field {
      width: 100% !important;
      padding: 0.65rem 2.85rem 0.65rem 2.85rem !important;
      background: rgba(255, 255, 255, 0.04) !important;
      border: 1px solid var(--card-border) !important;
      border-radius: var(--radius-md) !important;
      color: #ffffff !important;
      font-size: 0.9rem !important;
      height: 46px !important;
      line-height: 46px !important;
      box-sizing: border-box !important;
      font-family: inherit !important;
      transition: all 0.2s ease !important;
    }

    .login-field:focus {
      outline: none !important;
      border-color: var(--accent-primary) !important;
      background: rgba(255, 255, 255, 0.07) !important;
      box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.25) !important;
    }

    .btn-toggle-password {
      position: absolute;
      right: 0.75rem;
      background: none;
      border: none;
      color: var(--text-dim);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0.35rem;
      border-radius: var(--radius-sm);
      transition: color 0.2s ease;
      z-index: 2;
    }
    .btn-toggle-password:hover {
      color: #ffffff;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      padding: 0.65rem 1.25rem;
      font-size: 0.88rem;
      font-weight: 600;
      border-radius: var(--radius-md);
      border: none;
      cursor: pointer;
      transition: all 0.2s ease;
      font-family: inherit;
      text-decoration: none;
    }

    .btn-primary {
      background: linear-gradient(135deg, #6366f1, #4f46e5);
      color: #ffffff;
      box-shadow: 0 4px 14px rgba(99, 102, 241, 0.35);
    }
    .btn-primary:hover {
      background: linear-gradient(135deg, #4f46e5, #4338ca);
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(99, 102, 241, 0.5);
    }

    .btn-secondary {
      background: rgba(255, 255, 255, 0.06);
      color: #e2e8f0;
      border: 1px solid var(--card-border);
    }
    .btn-secondary:hover {
      background: rgba(255, 255, 255, 0.12);
      color: #ffffff;
      border-color: rgba(255, 255, 255, 0.2);
    }

    .btn-sm {
      padding: 0.4rem 0.8rem;
      font-size: 0.78rem;
      border-radius: var(--radius-sm);
    }

    .w-full {
      width: 100%;
    }

    .mt-2 {
      margin-top: 0.75rem;
    }

    .login-alert {
      padding: 0.85rem 1rem;
      border-radius: var(--radius-md);
      font-size: 0.85rem;
      margin-bottom: 1.25rem;
      display: flex;
      align-items: center;
      gap: 0.65rem;
    }

    .login-alert.danger {
      background: rgba(244, 63, 94, 0.15);
      border: 1px solid rgba(244, 63, 94, 0.35);
      color: #fecdd3;
    }

    .login-alert.success {
      background: rgba(16, 185, 129, 0.15);
      border: 1px solid rgba(16, 185, 129, 0.35);
      color: #a7f3d0;
    }

    .login-footer-links {
      text-align: center;
      margin-top: 1.5rem;
      font-size: 0.85rem;
    }

    .link-public {
      color: var(--accent-cyan);
      text-decoration: none;
      font-weight: 600;
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      transition: color 0.2s ease;
    }
    .link-public:hover {
      color: #7dd3fc;
      text-decoration: underline;
    }

    .hidden {
      display: none !important;
    }
  </style>
</head>
<body>

  <!-- Ambient Glow Effects -->
  <div class="ambient-glow glow-1"></div>
  <div class="ambient-glow glow-2"></div>

  <!-- Consistent Top Navigation Bar -->
  <header class="app-header">
    <div class="header-container">
      <div class="brand">
        <a href="/">
          <div class="brand-logo">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"></path>
            </svg>
          </div>
          <div class="brand-text">
            <span class="university-tag">FAST-NUCES Peshawar</span>
            <h1 class="portal-title">Research Opportunity Portal</h1>
          </div>
        </a>
      </div>

      <div class="header-actions">
        <a href="/" class="btn btn-secondary btn-sm">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="19" y1="12" x2="5" y2="12"></line>
            <polyline points="12 19 5 12 12 5"></polyline>
          </svg>
          Back to Public Portal
        </a>
      </div>
    </div>
  </header>

  <!-- Centered Login Card -->
  <main class="login-page-container">
    <div class="login-card">
      
      <div class="login-header">
        <div class="login-logo">
          <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
            <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
          </svg>
        </div>
        <span class="university-tag">FAST-NUCES Peshawar</span>
        <h2 class="login-title">Administrator Access</h2>
        <p class="login-subtitle">Sign in to manage faculty research openings and postings</p>
      </div>

      <!-- Quick Demo Credentials Helper Card -->
      <div class="demo-credentials-box">
        <div class="demo-cred-info">
          <span class="demo-cred-label">Seeded Credentials</span>
          <span class="demo-cred-values">admin / AdminPassword123!</span>
        </div>
        <button type="button" id="btnFillDemo" class="btn-fill-demo">Fill Demo</button>
      </div>

      <!-- Alert Banner (Hidden by Default) -->
      <div id="loginAlert" class="login-alert danger hidden">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="10"></circle>
          <line x1="12" y1="8" x2="12" y2="12"></line>
          <line x1="12" y1="16" x2="12.01" y2="16"></line>
        </svg>
        <span id="loginAlertText">Invalid username or password.</span>
      </div>

      <form id="adminLoginForm" novalidate>
        
        <div class="form-group">
          <label for="username">Administrator Username <span class="required">*</span></label>
          <div class="input-with-icon-wrapper">
            <span class="input-leading-icon">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                <circle cx="12" cy="7" r="4"></circle>
              </svg>
            </span>
            <input 
              type="text" 
              id="username" 
              class="login-field" 
              placeholder="e.g. admin" 
              required 
              autocomplete="username"
            >
          </div>
        </div>

        <div class="form-group">
          <label for="password">Password <span class="required">*</span></label>
          <div class="input-with-icon-wrapper">
            <span class="input-leading-icon">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
                <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
              </svg>
            </span>
            <input 
              type="password" 
              id="password" 
              class="login-field" 
              placeholder="Enter administrator password" 
              required 
              autocomplete="current-password"
            >
            <button type="button" id="btnTogglePassword" class="btn-toggle-password" title="Toggle password visibility">
              <svg id="eyeIcon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                <circle cx="12" cy="12" r="3"></circle>
              </svg>
            </button>
          </div>
        </div>

        <button type="submit" id="btnSubmitLogin" class="btn btn-primary w-full mt-2" style="height: 46px;">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"></path>
            <polyline points="10 17 15 12 10 7"></polyline>
            <line x1="15" y1="12" x2="3" y2="12"></line>
          </svg>
          Sign In as Administrator
        </button>

      </form>

      <div class="login-footer-links">
        <a href="/" class="link-public">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="19" y1="12" x2="5" y2="12"></line>
            <polyline points="12 19 5 12 12 5"></polyline>
          </svg>
          Return to Research Opportunities (Visitor Mode)
        </a>
      </div>

    </div>
  </main>

  <script>
    const form = document.getElementById('adminLoginForm');
    const alertBox = document.getElementById('loginAlert');
    const alertText = document.getElementById('loginAlertText');
    const submitBtn = document.getElementById('btnSubmitLogin');
    const usernameInput = document.getElementById('username');
    const passwordInput = document.getElementById('password');
    const btnTogglePassword = document.getElementById('btnTogglePassword');
    const eyeIcon = document.getElementById('eyeIcon');
    const btnFillDemo = document.getElementById('btnFillDemo');

    // Auto-fill demo credentials helper
    btnFillDemo.addEventListener('click', () => {
      usernameInput.value = 'admin';
      passwordInput.value = 'AdminPassword123!';
      alertBox.classList.add('hidden');
    });

    // Password visibility toggle
    btnTogglePassword.addEventListener('click', () => {
      const isPassword = passwordInput.getAttribute('type') === 'password';
      passwordInput.setAttribute('type', isPassword ? 'text' : 'password');
      
      if (isPassword) {
        eyeIcon.innerHTML = `
          <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
          <line x1="1" y1="1" x2="23" y2="23"></line>
        `;
      } else {
        eyeIcon.innerHTML = `
          <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
          <circle cx="12" cy="12" r="3"></circle>
        `;
      }
    });

    // Form submission
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      alertBox.classList.add('hidden');

      const username = usernameInput.value.trim();
      const password = passwordInput.value;

      if (!username || !password) {
        showAlert('Please provide both username and password.', 'danger');
        return;
      }

      submitBtn.disabled = true;
      submitBtn.innerHTML = `
        <span style="display:inline-block; width:16px; height:16px; border:2px solid rgba(255,255,255,0.3); border-top-color:#fff; border-radius:50%; animation:spin 0.8s linear infinite; margin-right:8px;"></span>
        Authenticating...
      `;

      try {
        const response = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          credentials: 'include',
          body: JSON.stringify({ username, password })
        });

        const data = await response.json();

        if (!response.ok) {
          throw new Error(data.message || 'Authentication failed. Please verify credentials.');
        }

        // Store token and administrator session in localStorage
        if (data.token) {
          localStorage.setItem('admin_token', data.token);
          localStorage.setItem('admin_user', JSON.stringify(data.admin));
        }

        showAlert('Authenticated successfully! Redirecting to dashboard...', 'success');
        setTimeout(() => {
          window.location.href = '/';
        }, 700);

      } catch (err) {
        showAlert(err.message, 'danger');
      } finally {
        submitBtn.disabled = false;
        submitBtn.innerHTML = `
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"></path>
            <polyline points="10 17 15 12 10 7"></polyline>
            <line x1="15" y1="12" x2="3" y2="12"></line>
          </svg>
          Sign In as Administrator
        `;
      }
    });

    function showAlert(msg, type = 'danger') {
      alertBox.className = `login-alert ${type}`;
      alertText.textContent = msg;
      alertBox.classList.remove('hidden');
    }
  </script>
</body>
</html>
